  milvus:
    image: milvusdb/milvus:v2.4.10
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: ""  # Embedded etcd - no external etcd needed
      MINIO_ADDRESS: garage
      MINIO_PORT: 3900
      MINIO_ACCESS_KEY_ID: GK48bac80794ed37b1a39e86b7  # Your Garage access key
      MINIO_SECRET_ACCESS_KEY: d692bda02d3183010c58070afccd415325f3608c2ec3c087fde645767984d698  # Your Garage secret key
      MINIO_BUCKET_NAME: milvus-bucket
      MINIO_USE_SSL: "false"
      MINIO_CLOUD_PROVIDER: aws
      MINIO_ROOT_PATH: files
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      garage:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s  # Extra time for embedded etcd bootstrap
    restart: unless-stopped
    networks:
      - app-network

  embedding-init:
    image: python:3.11-slim
    container_name: embedding-init
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app
    environment:
      POSTGRES_URI: postgresql://postgres:postgres@postgres:5432/recommender
      MILVUS_URI: http://milvus:19530
    command: >
      sh -c "
        pip install --no-cache-dir sentence-transformers pymilvus sqlalchemy pandas torch scikit-learn &&
        python scripts/generate_item_embeddings.py
      "
    networks:
      - app-network


volumes:
  postgres_data:
  milvus_data:

networks:
  app-network:
    driver: bridge